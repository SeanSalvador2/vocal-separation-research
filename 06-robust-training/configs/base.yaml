# Direction 06 base config (MASTER_PLAN §3.1, §3.3, §5). This file is the SHARED
# CLEAN CELL (ε = 0): it mirrors Direction 01's base identity fields exactly (model
# SingNet-C1 at base_channels=32, l1mag loss, reduced budget, full augmentation
# recipe, 86-song split) so its config hash is BIT-IDENTICAL to Direction 01's
# `l1mag_seed0_reduced` (and Directions 02/03's base). That equality (asserted by
# tests/test_config_schema_d06.py, gate G0) is why the ε=0 cell is *reused* from
# Direction 01 across the 3 clean seeds, never retrained (§3.3: "0 new runs").
#
# The bleed / trim arms inherit this file and add OPTIONAL `corrupt:` / `trim:`
# blocks. Because the clean cell carries neither, it hashes exactly as the old
# configs did (corruption ε=0 canonicalizes to "no corruption"; §3.1). Only two
# mechanisms ever enter this direction: the ε-bleed data path and the trim-q loss
# path — everything else is D01 §7.1 verbatim.

# --- experiment identity (mirrors D01 base) ---
arm: l1mag                 # the shared clean cell IS the D01 l1mag run
seed: 0
budget_name: reduced       # label only; `steps` is the real budget
loss_kwargs: {}

# --- training budget & schedule (identical to D01 REDUCED) ---
steps: 16000               # REDUCED budget (§1.3); FULL = 40000
batch_size: 16
chunk_s: 6.0
sample_rate: 44100
amp: true
deterministic: false

# --- model (fixed SingNet-C1) ---
base_channels: 32          # 9,835,745 params

# --- data pipeline (fixed across arms; full recipe on the 86-song split) ---
augment: true              # per-source gain + sign flip (§3.4)
remix: true                # cross-track vocals+accompaniment remixing (§3.4)

# --- locations (set at data-prep / run time; RUN LATER) ---
shard_root: null
splits_csv: 01-loss-function-study/configs/splits.csv   # the shared frozen split (§4)
registry_path: 06-robust-training/results/registry.csv
output_dir: checkpoints
num_workers: 4
gpu: ""
