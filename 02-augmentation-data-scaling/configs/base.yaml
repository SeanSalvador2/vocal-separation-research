# Direction 02 base config (MASTER_PLAN §1.3, §6). Mirrors the Direction-01 base
# on every experiment-identity field (model, optimizer budget, STFT, loss = l1mag,
# reduced budget) so that this file — the full-recipe / full-86-split / l1mag /
# reduced cell — is BIT-IDENTICAL in identity to Direction 01's `l1mag_seed0_reduced`
# and therefore shares its config hash. That equality (asserted by
# tests/test_config_schema.py, gate G0) is why the FULL-86 anchor cell is *reused*
# from Direction 01, not retrained (§3.3).
#
# Only two things ever vary across this direction's runs: the augmentation
# switchboard below (§3.1) and `data.track_allowlist_csv` (§3.2). Every leaf config
# overrides only those (and `seed`/`arm`).

# --- experiment identity ---
arm: l1mag                 # the project default loss; fixed for D02 (contingency: sisdr, §3.4)
seed: 0                    # run seed {0,1,2}
budget_name: reduced       # label only; `steps` is the real budget
loss_kwargs: {}

# --- training budget & schedule (identical to D01 REDUCED) ---
steps: 16000               # REDUCED budget (§1.3) — identical for every D02 run
batch_size: 16
chunk_s: 6.0
sample_rate: 44100
amp: true
deterministic: false

# --- model (fixed SingNet-C1) ---
base_channels: 32          # 9,835,745 params

# --- augmentation switchboard (§3.1, §5) — the factorized transforms ---
augment:
  remix: true              # cross-song source remixing (the pre-registered top lever)
  gain: true               # per-source amplitude U(0.25, 1.25)
  flip: true               # per-source sign flip p=0.5 (magnitude-invariant negative control)

# --- data pipeline ---
data:
  track_allowlist_csv: null   # null = full 86-song train split; a subset CSV for scaling (§3.2)
splits_csv: 01-loss-function-study/configs/splits.csv   # the shared frozen split (§4)

# --- locations (set at run time; RUN LATER) ---
shard_root: null
registry_path: 02-augmentation-data-scaling/results/registry.csv
output_dir: checkpoints
num_workers: 4
gpu: ""
