# Direction 03 base config (MASTER_PLAN §3.1, §3.2, §9). This file is the SHARED
# BASELINE CELL: it mirrors Direction 01's base identity fields exactly (model
# SingNet-C1 at base_channels=32, l1mag loss, reduced budget, full augmentation
# recipe, 86-song split) so its config hash is BIT-IDENTICAL to Direction 01's
# `l1mag_seed0_reduced` and Direction 02's `base.yaml`. That three-way equality
# (asserted by tests/test_config_schema_d03.py, gate G0) is why the `baseline`
# arm is *reused* from Direction 01, not retrained (§3.2: "0 new runs").
#
# The band-split variants inherit this file and add an OPTIONAL `model:` block
# (arch=bandsplit, ...). Because baseline configs carry no `model:` block, they
# hash exactly as the old configs did — old configs are unaffected (§3.2).

# --- experiment identity (mirrors D01 base) ---
arm: l1mag                 # the shared baseline cell IS the D01 l1mag run
seed: 0
budget_name: reduced       # label only; `steps` is the real budget
loss_kwargs: {}

# --- training budget & schedule (identical to D01 REDUCED) ---
steps: 16000               # REDUCED budget (§1.3); FULL = 40000
batch_size: 16
chunk_s: 6.0
sample_rate: 44100
amp: true
deterministic: false

# --- model (fixed SingNet-C1 baseline; variants override via `model:`) ---
base_channels: 32          # 9,835,745 params (baseline arm)

# --- data pipeline (fixed across arms; full recipe on the 86-song split) ---
augment: true              # per-source gain + sign flip (§3.3)
remix: true                # cross-track vocals+accompaniment remixing (§3.3)

# --- locations (set at data-prep / run time; RUN LATER) ---
shard_root: null
splits_csv: 01-loss-function-study/configs/splits.csv   # the shared frozen split
registry_path: 03-mini-band-split/results/registry.csv
output_dir: checkpoints
num_workers: 4
gpu: ""
