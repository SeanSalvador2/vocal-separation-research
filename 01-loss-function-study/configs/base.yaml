# Direction 01 base config (MASTER_PLAN §7.1). Every arm/seed config inherits
# this via `base: base.yaml` and overrides only what differs — so the five arms
# are bit-identical except for `arm` (and `loss_kwargs` for the exploratory λ).
# The config hash (singnet.utils.config.hash_config) keys the run registry and
# excludes "where" keys (shard_root/output_dir/registry_path/gpu/num_workers).

# --- experiment identity (overridden by leaf configs) ---
arm: l1mag                 # one of l1mag|msemag|logl1mag|sisdr|l1mrstft
seed: 0                    # run seed {0,1,2}
budget_name: reduced       # label only; `steps` is the real budget
loss_kwargs: {}            # e.g. {lam: 0.25} for exploratory l1mrstft

# --- training budget & schedule (identical across arms) ---
steps: 16000               # REDUCED budget (§3.2); FULL = 40000
batch_size: 16             # OOM fallback: batch 8 + grad-accum 2 (§7.1)
chunk_s: 6.0
sample_rate: 44100
amp: true                  # fp16 + GradScaler on CUDA; no-op on CPU
deterministic: false

# --- model (fixed SingNet-C1) ---
base_channels: 32          # 9,835,745 params (THEORY §5 / tests/test_model.py)

# --- data pipeline (fixed across arms) ---
augment: true              # per-source gain + sign flip (§4.5)
remix: true                # cross-track vocals+accompaniment remixing (§4.5)

# --- locations (set at data-prep / run time; RUN LATER) ---
shard_root: null           # decoded WAV shards; prepare_data.py writes them
splits_csv: 01-loss-function-study/configs/splits.csv
registry_path: 01-loss-function-study/results/registry.csv
output_dir: checkpoints    # Drive-backed in Colab; checkpoints are NOT committed
num_workers: 4
gpu: ""                    # recorded per run in the registry
